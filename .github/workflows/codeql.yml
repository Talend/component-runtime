name: CodeQL

on:
  workflow_dispatch:
  pull_request:

permissions:
  contents: read
  security-events: write

jobs:
  analyze:
    # Only use the token with trusted branches in this repository.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          server-id: github_packages
          server-username: GH_PACKAGES_USERNAME
          server-password: GH_PACKAGES_TOKEN
          cache: maven

      - uses: actions/cache@v4
        with:
          path: ~/.npm
          key: npm-${{ runner.os }}-${{ hashFiles('**/package-template.json', 'component-tools/src/main/frontend/package.json') }}
          restore-keys: npm-${{ runner.os }}-

      - uses: github/codeql-action/init@v4
        with:
          languages: java-kotlin
          build-mode: manual

      # Only compile what CodeQL needs: no tests, quality checks, docs, docker images or front-end builds.
      # Tests are not compiled (testing-spark alone took ~5 min); the 4 loading-analysis modules
      # that consume the test-jar of loading-dependencies-common are excluded accordingly.
      # Do not use -Dskip.npm: component-tools needs its npm install (asciidoctor.css) to build.
      - name: Build
        run: >
          mvn --batch-mode --no-transfer-progress package
          -T 1C
          -pl '!documentation,!images,!images/component-server-image,!images/component-starter-server-image,!reporting,!sample-parent/sample-features/loading-analysis/loading-dependencies-with-dataset,!sample-parent/sample-features/loading-analysis/loading-dependencies-with-datastore,!sample-parent/sample-features/loading-analysis/loading-dependencies-with-dynamicDependenciesConfiguration,!sample-parent/sample-features/loading-analysis/loading-dependencies-with-dataprepRunAnnotation'
          -Dmaven.test.skip=true
          -Djacoco.skip=true
          -Dmaven.javadoc.skip=true
          -Dspotless.check.skip=true
          -Dspotless.apply.skip=true
          -Dformatter.skip=true
          -Dcheckstyle.skip=true
          -Drat.skip=true
          -Denforcer.skip=true
          -Dgpg.skip=true
          -Dcomponent.front.build.skip=true
          -Dcomponent.starter.front.build.skip=true
          -Dmaven.artifact.threads=256
        env:
          GH_PACKAGES_USERNAME: ${{ vars.GH_PACKAGES_USERNAME }}
          GH_PACKAGES_TOKEN: ${{ secrets.GH_PACKAGES_TOKEN }}

      - uses: github/codeql-action/analyze@v4
        with:
          threads: 0