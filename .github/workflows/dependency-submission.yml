name: Maven dependency submission

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  submit-maven:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          server-id: github_packages
          server-username: GH_PACKAGES_USERNAME
          server-password: GH_PACKAGES_TOKEN

      - uses: advanced-security/maven-dependency-submission-action@v6.0.1
        env:
          GH_PACKAGES_USERNAME: ${{ vars.GH_PACKAGES_USERNAME }}
          GH_PACKAGES_TOKEN: ${{ secrets.GH_PACKAGES_TOKEN }}