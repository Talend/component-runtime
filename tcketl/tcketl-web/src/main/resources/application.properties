server.port=8080
spring.application.name=tcketl-web
vaadin.launch-browser=false
# What a new browser tab starts with, and the only hosts a user may point the application to (empty: any host)
tcketl.web.default-server=http://localhost:8080/api/v1
tcketl.web.allowed-hosts=
# Refuse hosts that resolve to loopback, link-local or private addresses (set to true when the application is shared)
tcketl.web.block-private-hosts=false
logging.level.com.vaadin=WARN
